version: '3.8'
services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    restart: always
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    expose:
      - "3001"
    restart: always
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: always
