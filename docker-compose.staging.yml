version: '3.8'

networks:
  staging_internal:
    driver: bridge
  traefik_network:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik-public}

volumes:
  redis_staging_data:
    name: redis_staging_data

services:
  redis:
    image: redis:7.4-alpine
    container_name: social-media-gads-redis-staging
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    networks:
      - staging_internal
    volumes:
      - redis_staging_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  migration:
    build:
      context: .
      dockerfile: packages/database/Dockerfile
    container_name: social-media-gads-migration-staging
    networks:
      - staging_internal
    env_file:
      - .env.staging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: social-media-gads-api-staging
    init: true
    networks:
      - staging_internal
      - traefik_network
    env_file:
      - .env.staging
    environment:
      PORT: 3001
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3001/api/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gads-api-staging.rule=Host(`${STAGING_API_HOST}`)"
      - "traefik.http.routers.gads-api-staging.entrypoints=websecure"
      - "traefik.http.routers.gads-api-staging.tls.certresolver=${TRAEFIK_CERTRESOLVER}"
      - "traefik.http.services.gads-api-staging.loadbalancer.server.port=3001"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: social-media-gads-worker-staging
    init: true
    networks:
      - staging_internal
    env_file:
      - .env.staging
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_ANON_KEY}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: social-media-gads-web-staging
    init: true
    networks:
      - staging_internal
      - traefik_network
    env_file:
      - .env.staging
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gads-web-staging.rule=Host(`${STAGING_WEB_HOST}`)"
      - "traefik.http.routers.gads-web-staging.entrypoints=websecure"
      - "traefik.http.routers.gads-web-staging.tls.certresolver=${TRAEFIK_CERTRESOLVER}"
      - "traefik.http.services.gads-web-staging.loadbalancer.server.port=3000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
